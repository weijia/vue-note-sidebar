name: Publish to npm

# 自动发布触发条件：
#   1) 推送形如 v1.2.3 的 tag
#   2) 在 GitHub 上发布 Release（published）
# 需要先在仓库 Settings → Secrets 配置 NPM_TOKEN（npm 账号的 Automation 类型 token）
on:
  push:
    tags:
      - 'v*'
  release:
    types: [published]

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Publish
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
